name: Offline copy

# Rebuilds the single-file offline copy whenever the notes change and attaches it to the
# "offline" release, so the download link in the README always gives the newest version.
on:
  push:
    branches: [main]
    paths: ["index.html", "assets/**", "favicon.svg", "tools/build_offline.py", ".github/workflows/offline.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: offline-copy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the offline file
        run: python3 tools/build_offline.py "${GITHUB_SHA::12}" ib-cs-notes-offline.html
      - name: Publish it to the "offline" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="One file with every topic, flashcard and practice question. Download it, then double-click to open it in your browser, no internet needed.

          This copy does not update itself. It shows a small banner when a newer copy is out, or you can always use the live site: https://d1v4nchik.github.io/dpcomputerscience27/

          Last updated $(date -u '+%-d %B %Y')."
          if ! gh release view offline >/dev/null 2>&1; then
            gh release create offline --title "Offline copy of the notes" --notes "$NOTES" --latest
          else
            gh release edit offline --notes "$NOTES"
          fi
          gh release upload offline "ib-cs-notes-offline.html#Built from ${GITHUB_SHA::12}" --clobber
